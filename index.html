<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Layer Prints</title>

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f19'/%3E%3Cpath d='M36 4L12 36h16l-6 24 30-36H36z' fill='%237c5cff'/%3E%3C/svg%3E">

<style>
body{margin:0;font-family:system-ui;background:#0b0f19;color:#e8eefc}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#11182a;border-radius:16px;padding:16px;margin-bottom:16px}
.btn{background:#7c5cff;color:#fff;border:0;padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.secondary{background:#222}
select,input,textarea{width:100%;padding:8px;border-radius:10px;border:1px solid #333;background:#0b0f19;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.price{font-weight:900}
</style>
</head>

<body>
<div class="wrap">

<h1>Local Layer Prints</h1>
<p>Local pickup or delivery</p>

<div class="products" id="productGrid"></div>

<div class="card">
<h3>Your Order</h3>

<label><input type="radio" name="fulfill" checked> Pickup (free)</label><br>
<label><input type="radio" name="fulfill"> Delivery (+$3)</label>

<p><strong>Total:</strong> <span id="total">$0.00</span></p>

<button class="btn" id="buildMessageBtn">Build order message</button>
<button class="btn secondary" id="emailBtn">Email order</button>
<button class="btn secondary" id="clearBtn">Clear</button>

<textarea id="messageBox" placeholder="Order message appears here"></textarea>
</div>

</div>

<script>
/* ===== AUTO UPDATE ===== */
(async function autoUpdate(){
  try{
    const r=await fetch("version.json?v="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    const k="llp_version";
    const last=localStorage.getItem(k);
    if(last && last!==j.v){localStorage.setItem(k,j.v);location.reload()}
    if(!last)localStorage.setItem(k,j.v);
  }catch(e){}
})();

/* ===== SHOP DATA ===== */
const CAPACITY_PRICE={3:12,4:13,5:14,6:15};
const COLORS=["Orange","Blue","Red","Gold","Grey"];
let OUT_OF_STOCK=new Set();

fetch("data.json")
.then(r=>r.json())
.then(d=>OUT_OF_STOCK=new Set(d.outOfStockColors||[]));

const PRODUCTS=[
{id:"glasses",name:"Stackable Glasses Stand",capacity:true},
{id:"shoes",name:"Stackable Shoe Stand",capacity:true},
{id:"scrub",name:"Scrub Daddy Holder",price:5},
{id:"wallet",name:"Cascade Wallet",price:10}
];

const cart=[];

/* ===== UI ===== */
const grid=document.getElementById("productGrid");
PRODUCTS.forEach(p=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`
  <h3>${p.name}</h3>
  ${p.capacity?`
  <select data-cap>
    <option value="3">3 ($12)</option>
    <option value="4">4 ($13)</option>
    <option value="5">5 ($14)</option>
    <option value="6">6 ($15)</option>
  </select>`:""}
  <select data-color>
    ${COLORS.map(c=>`<option ${OUT_OF_STOCK.has(c)?"disabled":""}>${c}${OUT_OF_STOCK.has(c)?" (Out)":""}</option>`).join("")}
  </select>
  <button class="btn">Add</button>`;
  d.querySelector("button").onclick=()=>{
    cart.push({p,cap:d.querySelector("[data-cap]")?.value,color:d.querySelector("[data-color]").value});
    renderTotal();
  };
  grid.appendChild(d);
});

function renderTotal(){
  let t=0;
  cart.forEach(i=>{
    t+=i.p.capacity?CAPACITY_PRICE[i.cap]:i.p.price;
  });
  document.getElementById("total").textContent="$"+t.toFixed(2);
}

document.getElementById("buildMessageBtn").onclick=()=>{
  document.getElementById("messageBox").value=
  cart.map(i=>`${i.p.name} | ${i.color} ${i.cap||""}`).join("\n");
};
document.getElementById("emailBtn").onclick=()=>{
  location.href="mailto:zacharygustafson99@gmail.com?subject=Order request The Local Layer&body="+encodeURIComponent(messageBox.value);
};
document.getElementById("clearBtn").onclick=()=>{
  cart.length=0;renderTotal();messageBox.value="";
};
</script>
</body>
</html>
